<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario Pro</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #ff7b00, #ffb347);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header{
            background-color: rgba(255,255,255,0.2);
            padding: 20px;
            text-align: center;
            color: white;
            backdrop-filter: blur(5px);
        }

        main{
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor{
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .perfil{
            text-align: center;
            margin-bottom: 20px;
        }

        .perfil img{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ff7b00;
            object-fit: cover;
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
            color: #ff7b00;
        }

        form{
            display: flex;
            flex-direction: column;
        }

        label{
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input{
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
        }

        input:focus{
            border-color: #ff7b00;
        }

        .color-box{
            height: 50px;
            padding: 5px;
        }

        button{
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: #ff7b00;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background-color: #e66a00;
        }

        footer{
            text-align: center;
            padding: 15px;
            color: white;
            background-color: rgba(0,0,0,0.2);
        }

        @media(max-width: 500px){

            .contenedor{
                padding: 20px;
            }

            .perfil img{
                width: 90px;
                height: 90px;
            }

        }

    </style>
</head>
<body>

    <header>
        <h1>Registro de Usuario Pro</h1>
    </header>

    <main>

        <section class="contenedor">

            <div class="perfil">
                <img src="https://i.pravatar.cc/300" alt="Imagen de perfil">
            </div>

            <h2>Crear Cuenta</h2>

            <form>

                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre" required>

                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>

                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    required>

                <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="fecha" required>

                <label for="color">Color Favorito</label>
                <input type="color" id="color" class="color-box">

                <label for="pais">País</label>
                <input list="paises" id="pais" placeholder="Selecciona un país">

                <datalist id="paises">
                    <option value="México">
                    <option value="Argentina">
                    <option value="Colombia">
                    <option value="Chile">
                    <option value="España">
                    <option value="Perú">
                    <option value="Estados Unidos">
                </datalist>

                <button type="submit">Registrarse</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Proyecto HTML5 - Registro Pro</p>
    </footer>

</body>
</html>
